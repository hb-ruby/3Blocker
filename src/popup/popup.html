<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <h1 class="brand-title"><span class="brand-accent">3</span>Blocker</h1>
        <!-- Spray-paint squiggle under the logo -->
        <svg class="scribble" viewBox="0 0 120 14" width="120" height="14" aria-hidden="true">
          <path d="M2 9 C8 1, 12 1, 14 8 S20 13, 24 5 S32 1, 34 8 S40 13, 45 5 S53 1, 55 8 S61 13, 66 5 S74 1, 76 8 S82 13, 87 5 S95 1, 97 8 S104 12, 118 4"/>
        </svg>
      </div>
      <div class="header-side">
        <div class="header-status">
          <span class="status-indicator online"></span>
          <span class="status-text" id="protection-status">Active</span>
        </div>
        <button class="icon-btn" id="btn-open-list" title="Manage Blocklist" aria-label="Manage Blocklist">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Current Tab Banner -->
    <section class="site-card">
      <div class="site-icon-wrapper">
        <span class="site-icon" id="site-favicon">🌐</span>
      </div>
      <div class="site-details">
        <div class="site-host" id="current-host" title="Loading current page...">example.com</div>
        <div class="site-path" id="current-path">/loading</div>
      </div>
      <span class="site-badge" id="site-block-state">Allowed</span>
    </section>

    <!-- Block this site / this page -->
    <section class="control-card block-card">
      <div class="block-option">
        <div class="option-target">
          <span class="option-rule" id="site-rule">—</span>
          <span class="option-scope">+ all subdomains</span>
        </div>
        <button class="action-btn block-btn" id="btn-block-site">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
          </svg>
          <span>Block site</span>
        </button>
      </div>

      <div class="block-option">
        <div class="option-target">
          <span class="option-rule" id="page-rule">—</span>
          <span class="option-scope">this exact page</span>
        </div>
        <button class="action-btn page-btn" id="btn-block-page">
          <span>Block page</span>
        </button>
      </div>

      <p class="block-note" id="block-note" hidden></p>
    </section>
  </div>

  <script src="../background/blocklist-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
