<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <h1 class="brand-title"><span class="brand-accent">3</span>Blocker</h1>
        <!-- Spray-paint squiggle under the logo -->
        <svg class="scribble" viewBox="0 0 120 14" width="120" height="14" aria-hidden="true">
          <path d="M2 9 C8 1, 12 1, 14 8 S20 13, 24 5 S32 1, 34 8 S40 13, 45 5 S53 1, 55 8 S61 13, 66 5 S74 1, 76 8 S82 13, 87 5 S95 1, 97 8 S104 12, 118 4"/>
        </svg>
      </div>
      <div class="header-status">
        <span class="status-indicator online"></span>
        <span class="status-text" id="protection-status">Active</span>
      </div>
    </header>

    <!-- Current Tab Banner -->
    <section class="site-card">
      <div class="site-icon-wrapper">
        <span class="site-icon" id="site-favicon">🌐</span>
      </div>
      <div class="site-details">
        <div class="site-host" id="current-host" title="Loading current page...">example.com</div>
        <div class="site-path" id="current-path">/loading</div>
      </div>
      <span class="site-badge" id="site-block-state">Allowed</span>
    </section>

    <!-- Domain Level Selector Slider (The 3Blocker Slider) -->
    <section class="control-card slider-section">
      <div class="section-header">
        <div class="section-title-wrap">
          <span class="section-icon" aria-hidden="true"></span>
          <span class="section-title">Block Level</span>
        </div>
        <span class="level-pill" id="level-pill">Level 2 &bull; Subdomain</span>
      </div>

      <!-- Stepped Slider -->
      <div class="slider-wrapper">
        <input 
          type="range" 
          id="domain-level-slider" 
          min="1" 
          max="3" 
          step="1" 
          value="2" 
          aria-label="Domain level slider"
        >
        <div class="slider-ticks">
          <div class="tick-mark" data-step="1">
            <span class="tick-dot"></span>
            <span class="tick-label">Page</span>
          </div>
          <div class="tick-mark active" data-step="2">
            <span class="tick-dot"></span>
            <span class="tick-label">Subdomain</span>
          </div>
          <div class="tick-mark" data-step="3">
            <span class="tick-dot"></span>
            <span class="tick-label">Root Domain</span>
          </div>
        </div>
      </div>

      <!-- Preview of What Will Be Blocked -->
      <div class="block-preview-box">
        <div class="preview-label">Target to block:</div>
        <div class="preview-target" id="preview-target-text">
          <span class="target-protocol">https://</span><span class="target-highlight" id="target-highlight">sub.example.com/*</span>
        </div>
        <div class="preview-description" id="preview-desc">
          Blocks all pages under this specific subdomain only.
        </div>
      </div>

      <!-- Block Action Button -->
      <button class="action-btn block-btn" id="btn-block-level">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
        </svg>
        <span id="btn-block-text">Block Selected Level</span>
      </button>
    </section>

    <!-- Footer / Quick Stats -->
    <footer class="app-footer">
      <div class="footer-stat">
        <span class="stat-num" id="stat-count">8</span>
        <span class="stat-label">Sites Blocked</span>
      </div>
      <div class="footer-actions">
        <button class="icon-btn" id="btn-open-list" title="Manage Blocklist">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
