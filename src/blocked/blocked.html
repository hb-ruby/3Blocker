<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Blocker - Website Blocked</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="blocked-card">
    <h1 class="blocked-title pending" id="blocked-title">Not <span class="title-accent">here.</span></h1>
    <!-- Spray-paint squiggle under the headline -->
    <svg class="scribble" viewBox="0 0 120 14" width="180" height="21" aria-hidden="true">
      <path d="M2 9 C8 1, 12 1, 14 8 S20 13, 24 5 S32 1, 34 8 S40 13, 45 5 S53 1, 55 8 S61 13, 66 5 S74 1, 76 8 S82 13, 87 5 S95 1, 97 8 S104 12, 118 4"/>
    </svg>
    <p class="blocked-subtitle" id="blocked-subtitle">3Blocker has blocked access to this page.</p>

    <div class="details-box">
      <div class="details-row">
        <span class="details-label">URL</span>
        <span class="details-value target-url" id="target-url">Loading...</span>
      </div>
      <div class="details-row">
        <span class="details-label">Reason</span>
        <span class="details-value reason-badge" id="block-reason">Adult / Explicit Content</span>
      </div>
      <div class="details-row" id="match-row">
        <span class="details-label">Rule</span>
        <span class="details-value match-rule" id="match-rule">--</span>
      </div>
    </div>

    <div class="actions-group">
      <button class="btn btn-primary" id="btn-go-back">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Go Back
      </button>

      <button class="btn btn-secondary" id="btn-allow-site" hidden>
        Allow this site
      </button>
    </div>

    <p class="allow-note" id="allow-note" hidden></p>

    <footer class="blocked-footer">
      <span><span class="brand-accent">3</span>Blocker</span>
    </footer>
  </main>

  <script src="../background/blocklist-core.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
